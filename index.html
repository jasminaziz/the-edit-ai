<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Edit | AI Tools for Charity, Cultural & Heritage Comms</title>
    <!--
      data-rh="true" on the five tags below is LOAD-BEARING. Do not remove it.

      react-helmet-async only ever removes head tags carrying data-rh (it does
      `querySelectorAll('meta[data-rh]')`), so a static tag without it is
      invisible to helmet and survives alongside the per-page one SEO.tsx
      injects. Until 31 Aug 2026 that is exactly what happened: every page using
      <SEO> carried TWO descriptions, two og:titles, two og:descriptions and two
      twitter equivalents, with this static homepage copy FIRST in document
      order. Anything reading the first match got the homepage description on
      /tools, /learning, /design-kit and four other routes.

      Marking them lets helmet adopt and replace them, which keeps this block as
      the no-JS fallback (crawlers that do not run JS still get a description)
      while removing the duplication for everyone else. Stripping the tags
      instead would have fixed the duplicates by deleting the fallback.

      og:image (with its width, height and alt), og:type, twitter:card and
      twitter:image (with its alt) below are deliberately NOT marked: SEO.tsx
      never emits them, so they are genuinely sitewide and must survive.
      Any tag added here that SEO.tsx also emits needs data-rh too.
    -->
    <meta data-rh="true" name="description" content="An opinionated AI tools directory for charity, cultural and heritage comms teams. Data location, training policy and nonprofit pricing checked on every tool. No sponsored lists.">
    <meta name="author" content="Jasmin Aziz" />
    <meta name="google-site-verification" content="2_93U4mtnkpPZgW6fZZJaOIQ7tEKv7__f8JSMuO0HC8" />


    <!--
      Icons, pruned 12 Sep 2026 to three links. Every raster is drawn from
      favicon.svg by assets-src/render-icons.py; do not hand-edit a PNG.
      The .ico says sizes="32x32", not "any": with "any", Chrome prefers the
      .ico over the SVG. The 192 and 512 PNGs are linked from the web
      manifest (vite.config.ts), which the PWA plugin injects below.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#2D35C9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="The Edit" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta data-rh="true" property="og:title" content="The Edit | AI Tools for Charity, Cultural & Heritage Comms">
  <meta data-rh="true" name="twitter:title" content="The Edit | AI Tools for Charity, Cultural & Heritage Comms">
  <meta data-rh="true" property="og:description" content="An opinionated AI tools directory for charity, cultural and heritage comms teams. Data location, training policy and nonprofit pricing checked on every tool. No sponsored lists.">
  <meta data-rh="true" name="twitter:description" content="An opinionated AI tools directory for charity, cultural and heritage comms teams. Data location, training policy and nonprofit pricing checked on every tool. No sponsored lists.">
  <!-- The share card. One card for every route: platforms do not run JS, so
       they read this block on every URL. A changed card gets a NEW filename,
       never an overwrite, because platforms cache by URL. Source and render
       command: assets-src/og-card.html. None of these tags carries data-rh,
       because SEO.tsx never emits them. -->
  <meta property="og:image" content="https://theeditai.co.uk/og-edit-2026-09.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Edit. AI tools for charity, cultural and heritage comms. Curated by Jasmin Aziz.">
  <meta name="twitter:image" content="https://theeditai.co.uk/og-edit-2026-09.png">
  <meta name="twitter:image:alt" content="The Edit. AI tools for charity, cultural and heritage comms. Curated by Jasmin Aziz.">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
