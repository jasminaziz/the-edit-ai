# Watchdog for the daily whats_new pipeline.
#
# The Routine's dispatch step fails silently when it can't reach GitHub: no
# workflow run is created, nothing errors, no email arrives (this is how the
# June 2026 stall went unnoticed for ten days, and how single-day gaps
# accumulated in early July under the old 48-hour window). This workflow
# checks once a day that append-whats-new succeeded within the last 26 hours
# and fails loudly if not — a failed scheduled run triggers GitHub's failure
# email. 26 hours = one daily cycle plus slack for schedule drift, so a
# single missed morning alerts the same day.
#
# It runs on the built-in github.token, not a PAT, so it cannot lapse the
# same way. One caveat: GitHub pauses scheduled workflows after 60 days of
# repo inactivity (it emails a warning before disabling).

name: whats_new watchdog

on:
  schedule:
    - cron: '0 12 * * 2-6' # Tue-Sat only. The Rundown publishes Mon-Fri and the
                           # Routine processes the previous day's email, so appends
                           # land Tue-Sat. Sun and Mon have nothing to check and were
                           # the source of every false alarm to 30 Aug 2026 (9 of 10
                           # alerts fell on a Sunday or Monday). The 26-hour window
                           # stays as is: widening it would blind the watchdog to a
                           # genuine two-day outage midweek.
  workflow_dispatch: {} # allows a manual test run

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if append-whats-new has not succeeded in 26 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/append-whats-new.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$latest" ]; then
            echo "No successful append-whats-new run found at all."
            exit 1
          fi

          echo "Last successful append: $latest"
          latest_epoch=$(date -d "$latest" +%s)
          cutoff_epoch=$(date -d '26 hours ago' +%s)

          if [ "$latest_epoch" -lt "$cutoff_epoch" ]; then
            echo "STALE: no successful run in the last 26 hours."
            echo "The dispatch chain has probably stopped. Check the Routine's last run"
            echo "transcript in claude.ai first. The dispatch must go through the GitHub"
            echo "MCP tool (actions_run_trigger) — raw curl to api.github.com does not"
            echo "work from the Routine sandbox (its proxy strips Authorization headers)."
            exit 1
          fi

          echo "OK: pipeline ran within the last 26 hours."
