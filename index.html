    <title>The Edit | AI Tools for Charity, Cultural & Heritage Comms</title>
    <!--
      data-rh="true" on the five tags below is LOAD-BEARING. Do not remove it.

      react-helmet-async only ever removes head tags carrying data-rh (it does
      `querySelectorAll('meta[data-rh]')`), so a static tag without it is
      invisible to helmet and survives alongside the per-page one SEO.tsx
      injects. Until 31 Aug 2026 that is exactly what happened: every page using
      <SEO> carried TWO descriptions, two og:titles, two og:descriptions and two
      twitter equivalents, with this static homepage copy FIRST in document
      order. Anything reading the first match got the homepage description on
      /tools, /learning, /design-kit and four other routes.

      Marking them lets helmet adopt and replace them, which keeps this block as
      the no-JS fallback (crawlers that do not run JS still get a description)
      while removing the duplication for everyone else. Stripping the tags
      instead would have fixed the duplicates by deleting the fallback.

      og:image, og:type and twitter:card below are deliberately NOT marked:
      SEO.tsx never emits them, so they are genuinely sitewide and must survive.
      Any tag added here that SEO.tsx also emits needs data-rh too.
    -->
    <meta data-rh="true" name="description" content="An opinionated AI tools directory for charity, cultural and heritage comms teams. Data location, training policy and nonprofit pricing checked on every tool. No sponsored lists.">
    <meta name="author" content="Jasmin Aziz" />
    <meta name="google-site-verification" content="2_93U4mtnkpPZgW6fZZJaOIQ7tEKv7__f8JSMuO0HC8" />
