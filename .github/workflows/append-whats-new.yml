name: Append whats_new rows

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'Base64-encoded JSON payload (5 rows for whats_new tab)'
        required: true
        type: string

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Decode payload and POST to Apps Script
        run: |
          echo '${{ inputs.payload_b64 }}' | base64 -d > /tmp/payload.json
          echo "Payload to send:"
          cat /tmp/payload.json
          RESPONSE=$(curl -s -L -X POST \
            "https://script.google.com/macros/s/AKfycbxGOh2fvk986AMMh_f57uZRAftaCuJGT-E9XOC_0FI36zGSCGVOF2OY81bn3LxCR0I/exec" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json)
          echo "Apps Script response: $RESPONSE"
          python3 -c "
import sys, json
try:
    d = json.loads('$RESPONSE')
except json.JSONDecodeError:
    print('ERROR: Could not parse Apps Script response as JSON')
    sys.exit(1)
if not d.get('success'):
    print('ERROR: Apps Script reported failure:', d)
    sys.exit(1)
print('Success:', d.get('rows_added'), 'rows added to whats_new tab')
"
