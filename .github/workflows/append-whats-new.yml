name: Append whats_new rows

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'Base64-encoded JSON payload'
        required: true
        type: string

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Decode payload and POST to Apps Script
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          echo "Payload:"
          cat /tmp/payload.json
          RESPONSE=$(curl -s -L \
            "https://script.google.com/macros/s/AKfycbxGOh2fvk986AMMh_f57uZRAftaCuJGT-E9XOC_0FI36zGSCGVOF2OY81bn3LxCR0I/exec" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json)
          echo "Apps Script response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Success"
          else
            echo "ERROR: Apps Script did not return success: $RESPONSE"
            exit 1
          fi
