name: Append whats_new rows

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'Base64-encoded JSON payload'
        required: true
        type: string

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Decode payload and POST to Apps Script
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          # The exec URL and the shared token live in repository secrets, never in
          # this public repo. GitHub masks both in the log.
          EXEC_URL: ${{ secrets.WHATS_NEW_EXEC_URL }}
          TOKEN: ${{ secrets.WHATS_NEW_TOKEN }}
        run: |
          if [ -z "$EXEC_URL" ] || [ -z "$TOKEN" ]; then
            echo "ERROR: the WHATS_NEW_EXEC_URL or WHATS_NEW_TOKEN repository secret is not set"
            exit 1
          fi
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          echo "Payload:"
          cat /tmp/payload.json
          RESPONSE=$(curl -s -L \
            "${EXEC_URL}?token=${TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json)
          echo "Apps Script response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Success"
          else
            echo "ERROR: Apps Script did not return success: $RESPONSE"
            exit 1
          fi

  # One push notification per batch, sent only after the append succeeded.
  # A separate job, so a push failure never marks the append itself as failed.
  # Plan and rulings: reports/2026-10-08-push-notifications-plan.md.
  notify:
    needs: append
    runs-on: ubuntu-latest
    steps:
      - name: Send the AI News push notification
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: |
          if [ -z "$PUSH_SEND_SECRET" ]; then
            echo "::warning::PUSH_SEND_SECRET is not set, so no notification was sent"
            exit 0
          fi
          COUNT=$(printf '%s' "$PAYLOAD_B64" | base64 -d | jq '.rows | length')
          if [ "$COUNT" -lt 1 ]; then
            echo "No stories in this batch, so no notification"
            exit 0
          fi
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST "https://theeditai.co.uk/api/push-send" \
            -H "Authorization: Bearer ${PUSH_SEND_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"count\": ${COUNT}}")
          STATUS=$(printf '%s' "$RESPONSE" | tail -n 1)
          echo "Push send response (${STATUS}): $(printf '%s' "$RESPONSE" | sed '$d')"
          # 409 is the daily cap working: today's notification has already gone.
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "409" ]; then
            exit 0
          fi
          echo "ERROR: the push send failed. The rows were appended; only the notification is missing."
          exit 1
