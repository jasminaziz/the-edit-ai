<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The source of every icon on the site: assets-src/render-icons.py
       draws the .ico, apple-touch-icon and manifest PNGs from this file.
       Every edge sits on an even unit, so at 16px it lands on whole pixels
       and the two gaps stay open. The first version put each capsule on a
       half pixel at 16px, which greyed the gaps and fused the three. -->
  <rect width="32" height="32" fill="#2D35C9"/>
  <rect x="4" y="4" width="24" height="6" rx="3" fill="#C8F04A"/>
  <rect x="10" y="12" width="18" height="6" rx="3" fill="#C8F04A"/>
  <rect x="4" y="20" width="24" height="6" rx="3" fill="#C8F04A"/>
</svg>
